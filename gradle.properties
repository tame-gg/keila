group=gg.tame.keila
# keilaVersion is Keila's own version. Paper has no matching upstream release,
# so Keila owns this designation while compiling against the real Minecraft build
# base defined by mcVersion below. Keep version's prefix in sync with keilaVersion.
keilaVersion=26.1.2
version=26.1.2-R0.1-SNAPSHOT
# mcVersion / apiVersion track the real upstream Minecraft base that paperweight
# fetches sources and mache for, so they must stay on a version that exists
# upstream (1.21.11), independent of keilaVersion above.
mcVersion=1.21.11
# This is the current API version for use in (paper-)plugin.yml files
# During snapshot cycles this should be the anticipated version of the release target
apiVersion=1.21.11

paperCommit=c5eb0790f199da6c38d0a650e1e5cd5415b28185

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
